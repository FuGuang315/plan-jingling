<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>计划鲸灵</title>
  <meta name="theme-color" content="#6C8BFF" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部 -->
    <header class="header">
      <div class="brand">
        <span class="brand-icon">🐋</span>
        <div>
          <h1>计划鲸灵</h1>
          <p id="today-line">今天也要加油哦</p>
        </div>
      </div>
      <button class="sync-btn" id="sync-btn" title="同步">☁️</button>
    </header>

    <!-- 分类筛选 -->
    <div class="chips" id="cat-chips"></div>

    <!-- 内容区 -->
    <main class="content" id="content"></main>

    <!-- 底部导航 -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="today"><span>📅</span>今天</button>
      <button class="tab" data-tab="week"><span>🗓️</span>周</button>
      <button class="tab" data-tab="month"><span>📆</span>月</button>
      <button class="tab" data-tab="all"><span>📋</span>全部</button>
    </nav>

    <!-- 添加按钮 -->
    <button class="fab" id="fab" title="新建计划">＋</button>
  </div>

  <!-- 新建/编辑 弹窗 -->
  <div class="overlay" id="overlay" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="sheet-title">新建计划</h2>
        <button class="icon-btn" id="sheet-close">✕</button>
      </div>

      <label class="field">
        <span>标题</span>
        <input id="f-title" type="text" placeholder="比如：背 50 个单词" maxlength="60" />
      </label>

      <div class="field">
        <span>分类</span>
        <div class="seg" id="f-cat"></div>
      </div>

      <div class="field">
        <span>周期</span>
        <div class="seg" id="f-period">
          <button data-period="once">单次</button>
          <button data-period="daily">每天</button>
          <button data-period="weekly">每周</button>
          <button data-period="monthly">每月</button>
        </div>
      </div>

      <label class="field" id="f-due-wrap" hidden>
        <span>截止日期</span>
        <input id="f-due" type="date" />
      </label>

      <label class="field">
        <span>备注（可选）</span>
        <textarea id="f-note" rows="2" placeholder="补充说明…"></textarea>
      </label>

      <div class="field">
        <span>子任务（可选）</span>
        <div id="f-sub-list"></div>
        <div class="sub-add">
          <input id="f-sub-input" type="text" placeholder="加一个子任务，回车确认" />
        </div>
      </div>

      <div class="sheet-actions">
        <button class="btn ghost" id="sheet-cancel">取消</button>
        <button class="btn primary" id="sheet-save">保存</button>
      </div>
    </div>
  </div>

  <!-- 同步设置 弹窗 -->
  <div class="overlay" id="sync-overlay" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h2>同步设置</h2>
        <button class="icon-btn" id="sync-close">✕</button>
      </div>
      <div id="sync-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
