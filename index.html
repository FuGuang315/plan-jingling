<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>计划鲸灵</title>
  <meta name="theme-color" content="#6C8BFF" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css?v=31" />
</head>
<body>
  <div class="app">
    <!-- 顶部 -->
    <header class="header">
      <div class="brand">
        <span class="brand-icon">🐋</span>
        <div>
          <h1>计划鲸灵</h1>
          <p id="today-line">今天也要加油哦</p>
        </div>
      </div>
      <button class="sync-btn" id="menu-btn" title="菜单">☰<span>菜单</span></button>
    </header>

    <!-- 分类筛选 -->
    <div class="chips" id="cat-chips"></div>

    <!-- 内容区 -->
    <main class="content" id="content"></main>

    <!-- 底部导航 -->
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="memo"><span>📌</span>备忘录</button>
      <button class="tab active" data-tab="today"><span>📅</span>今天</button>
      <button class="tab" data-tab="week"><span>🗓️</span>每周</button>
      <button class="tab" data-tab="month"><span>📆</span>月</button>
      <button class="tab sort-btn" id="sort-btn"><span>↕️</span>排序</button>
    </nav>

    <!-- 底部输入条:加号 + 助手 -->
    <div class="assist-bar" id="assist-bar">
      <button class="fab" id="fab" title="新建计划">＋</button>
      <div class="assist-input">
        <input id="assist-input" type="text" placeholder="对鲸灵说…" autocomplete="off" enterkeyhint="send" />
        <button class="icon-btn" id="assist-mic" title="语音">🎤</button>
        <button class="icon-btn" id="assist-send" title="发送">➤</button>
      </div>
    </div>
  </div>

  <!-- 新建/编辑 弹窗 -->
  <div class="overlay" id="overlay" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="sheet-title">新建计划</h2>
        <button class="icon-btn" id="sheet-close">✕</button>
      </div>

      <label class="field">
        <span>标题</span>
        <input id="f-title" type="text" placeholder="比如：背 50 个单词" maxlength="60" />
      </label>

      <div class="field">
        <span>分类</span>
        <div class="seg" id="f-cat"></div>
      </div>

      <div class="field">
        <span>类型</span>
        <div class="seg" id="f-type">
          <button data-type="once">单次</button>
          <button data-type="recurring">循环</button>
        </div>
      </div>

      <div class="field" id="f-cycle-wrap" hidden>
        <span>循环周期</span>
        <div class="seg" id="f-cycle">
          <button data-cycle="daily">每天</button>
          <button data-cycle="weekly">每周</button>
          <button data-cycle="monthly">每月</button>
        </div>
      </div>

      <div class="field" id="f-oncetype-wrap" hidden>
        <span>单次类型</span>
        <div class="seg" id="f-oncetype">
          <button data-oncetype="event">当天事件</button>
          <button data-oncetype="deadline">截止任务</button>
        </div>
      </div>

      <label class="field" id="f-due-wrap" hidden>
        <span id="f-due-label">截止日期</span>
        <input id="f-due" type="date" />
      </label>

      <div class="field" id="f-range-wrap" hidden>
        <span>日期范围（可选，循环任务用）</span>
        <div class="range-row">
          <input id="f-start" type="date" />
          <span>至</span>
          <input id="f-end" type="date" />
        </div>
      </div>

      <label class="field">
        <span>备注（可选）</span>
        <textarea id="f-note" rows="2" placeholder="补充说明…"></textarea>
      </label>

      <div class="field">
        <span>重要度（1-10，默认 5）</span>
        <input id="f-imp" type="number" min="1" max="10" value="5" />
      </div>

      <label class="field">
        <span>提醒时间（可选，空 = 不提醒）</span>
        <input id="f-remind" type="time" />
      </label>

      <div class="field">
        <span>子任务（可选）</span>
        <div id="f-sub-list"></div>
        <div class="sub-add">
          <input id="f-sub-input" type="text" placeholder="加一个子任务，回车确认" />
        </div>
      </div>

      <div class="sheet-actions">
        <button class="btn ghost" id="sheet-cancel">取消</button>
        <button class="btn primary" id="sheet-save">保存</button>
      </div>
    </div>
  </div>

  <!-- 同步设置 弹窗 -->
  <div class="overlay" id="sync-overlay" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h2>同步设置</h2>
        <button class="icon-btn" id="sync-close">✕</button>
      </div>
      <div id="sync-body"></div>
    </div>
  </div>

  <!-- 提醒设置 -->
  <div class="overlay" id="remind-overlay" hidden>
    <div class="sheet">
      <div class="sheet-head"><h2>提醒设置</h2><button class="icon-btn" id="remind-close">✕</button></div>
      <div id="remind-body"></div>
    </div>
  </div>

  <!-- 鲸灵助手聊天 -->
  <div class="overlay chat-overlay" id="chat-overlay" hidden>
    <div class="sheet chat-sheet" id="chat-sheet">
      <div class="chat-grip" id="chat-grip"><i></i></div>
      <div class="sheet-head chat-head">
        <h2>🐋 鲸灵助手</h2>
        <button class="icon-btn" id="chat-clear" title="清空聊天记录">🗑️</button>
        <button class="icon-btn" id="chat-close" title="收起">▾</button>
      </div>
      <div class="chat-msgs" id="chat-msgs"></div>
      <div class="chat-foot">
        <input id="chat-input" type="text" placeholder="对鲸灵说…" autocomplete="off" enterkeyhint="send" />
        <button class="icon-btn" id="chat-mic" title="语音">🎤</button>
        <button class="icon-btn" id="chat-send" title="发送">➤</button>
      </div>
    </div>
  </div>

  <!-- 助手设置 -->
  <div class="overlay" id="ds-overlay" hidden>
    <div class="sheet">
      <div class="sheet-head"><h2>助手设置</h2><button class="icon-btn" id="ds-close">✕</button></div>
      <div id="ds-body"></div>
    </div>
  </div>

  <!-- 通用确认弹窗 -->
  <div class="overlay" id="dialog-overlay" hidden>
    <div class="sheet dialog-sheet">
      <p class="dialog-msg" id="dialog-msg"></p>
      <div class="sheet-actions">
        <button class="btn ghost" id="dialog-cancel">取消</button>
        <button class="btn primary" id="dialog-ok">确定</button>
      </div>
    </div>
  </div>

  <!-- 鲸鱼菜单 -->
  <div class="overlay" id="whale-overlay" hidden>
    <div class="sheet">
      <div class="sheet-head"><h2>更多</h2><button class="icon-btn" id="whale-close">✕</button></div>
      <button class="menu-item" id="menu-sync"><span>☁️</span>同步<span class="menu-status" id="menu-sync-status"></span></button>
      <button class="menu-item" id="menu-cal"><span>📅</span>查看日历</button>
      <button class="menu-item" id="menu-remind"><span>🔔</span>提醒</button>
      <button class="menu-item" id="menu-chat"><span>💬</span>和鲸灵聊天</button>
      <button class="menu-item" id="menu-ds"><span>🤖</span>助手与语音设置</button>
      <!-- 以后新功能加这里 -->
    </div>
  </div>

  <!-- 排序设置 -->
  <div class="overlay" id="sort-overlay" hidden>
    <div class="sheet">
      <div class="sheet-head"><h2>排序设置</h2><button class="icon-btn" id="sort-close">✕</button></div>
      <div id="sort-body"></div>
      <div class="sheet-actions">
        <button class="btn ghost" id="sort-toggle-all">全选/全不选</button>
        <button class="btn primary" id="sort-apply">查看结果</button>
      </div>
    </div>
  </div>

  <!-- 补卡 -->
  <div class="overlay" id="miss-overlay" hidden>
    <div class="sheet">
      <div class="sheet-head"><h2>补卡</h2><button class="icon-btn" id="miss-close">✕</button></div>
      <div id="miss-body"></div>
      <div class="sheet-actions"><button class="btn primary" id="miss-save">确认补卡</button></div>
    </div>
  </div>

  <script src="app.js?v=31"></script>
</body>
</html>
